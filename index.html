<style>
  /* ==========================================================
     NEUMORPHIC THEME (레퍼런스 반영) — 화이트 베이스 + 코랄 레드 액센트
     라이트(좌상) 그림자와 다크(우하) 그림자로 입체감을 만들고,
     눌린 상태/입력창/선택된 옵션은 inset 그림자로 표현
     ========================================================== */
  :root {
    --base: #efefef;                 /* 레퍼런스: 거의 흰색 베이스 */
    --base-deep: #e6e6e6;
    --sh-dark: #d2d2d2;              /* 우하단 그림자 (부드럽고 넓게) */
    --sh-light: #ffffff;             /* 좌상단 하이라이트 */
    --red: #ff5a5a;                  /* 코랄 레드 액센트 */
    --red-deep: #f43f3f;
    --red-grad: linear-gradient(135deg, #ff8080 0%, #ff4d4d 100%);
    --red-line: rgba(255, 90, 90, 0.85);
    --starbucks-green: #ff5a5a;      /* 기존 변수명 호환: 초록 → 레드 */
    --starbucks-dark: #3d3d3d;
    --starbucks-accent: #ff5a5a;
    --ink: #3f3f3f;
    --ink-soft: #8a8a8a;
    --ink-muted: #a9a9a9;
    --danger: #ff5a5a;
    --safe-bottom: env(safe-area-inset-bottom, 0);
    --safe-top: env(safe-area-inset-top, 0);
    --r: 22px;
    --ease: cubic-bezier(0.22, 1, 0.36, 1);

    /* 레퍼런스처럼 크고 확산된 그림자 */
    --raise:    12px 12px 26px var(--sh-dark), -12px -12px 26px var(--sh-light);
    --raise-sm: 7px 7px 16px var(--sh-dark), -7px -7px 16px var(--sh-light);
    --raise-xs: 4px 4px 9px var(--sh-dark), -4px -4px 9px var(--sh-light);
    --press:    inset 6px 6px 12px var(--sh-dark), inset -6px -6px 12px var(--sh-light);
    --press-sm: inset 3px 3px 7px var(--sh-dark), inset -3px -3px 7px var(--sh-light);
    --red-glow: 6px 6px 16px rgba(255,77,77,0.35), -6px -6px 16px var(--sh-light);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html { scroll-behavior: smooth; -webkit-text-size-adjust: 100%; background: var(--base); }

  body {
    font-family: 'Noto Sans KR', sans-serif;
    background: var(--base);
    color: var(--ink);
    line-height: 1.6;
    min-height: 100vh;
    padding-bottom: calc(112px + var(--safe-bottom));
    overflow-x: hidden;
  }

  button { font-family: inherit; -webkit-appearance: none; appearance: none; color: inherit; }
  input  { font-family: inherit; -webkit-appearance: none; appearance: none; color: inherit; }

  @keyframes fadeIn  { from { opacity: 0; } to { opacity: 1; } }
  @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
  @keyframes rise    { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
  @keyframes pulse   { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }

  /* ========== Hero: 돌출된 카드 안의 테슬라 배너 ========== */
  .hero {
    position: relative;
    margin: calc(1rem + var(--safe-top)) 1rem 0;
    border-radius: 28px;
    overflow: hidden;
    min-height: 420px;
    height: 58vh;
    height: 58svh;
    max-height: 560px;
    color: white;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    padding: 1.6rem 1.8rem 1.9rem;
    box-shadow: var(--raise);
    isolation: isolate;
    animation: rise 0.7s var(--ease) both;
  }
  .hero-bg {
    position: absolute;
    inset: 0;

  }
  .hero-bg::after {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(to bottom,
      rgba(30,57,50,0.10) 0%,
      rgba(30,57,50,0.20) 40%,
      rgba(30,57,50,0.78) 75%,
      rgba(30,57,50,0.94) 100%);
  }
  .hero::after {
    content: '';
    position: absolute;
    inset: 12px;
    border: 1px solid rgba(255,120,120,0.85);
    border-radius: 20px;
    pointer-events: none;
    z-index: 1;
  }
  .hero-inner { position: relative; z-index: 2; }

  .brand-mark {
    font-family: 'Montserrat', 'Noto Sans KR', sans-serif;
    font-weight: 500;
    font-size: 0.68rem;
    letter-spacing: 0.24em;
    color: #ff6b6b;
    text-transform: uppercase;
    display: flex;
    align-items: center;
    gap: 0.6rem;
    margin-bottom: 0.7rem;
  }
  .brand-mark::before { content: ''; width: 24px; height: 1px; background: #ff6b6b; opacity: 0.8; }

  h1 {
    font-family: 'Noto Serif KR', serif;
    font-weight: 900;
    font-size: clamp(1.75rem, 6.5vw, 2.3rem);
    letter-spacing: -0.02em;
    line-height: 1.2;
    margin-bottom: 0.4rem;
    text-shadow: 0 2px 16px rgba(0,0,0,0.5);
    word-break: keep-all;
  }
  h1 .accent {
    font-family: 'Playfair Display', serif;
    font-style: italic;
    color: #ff6b6b;
    font-weight: 700;
    display: block;
    font-size: 1.1em;
  }
  .header-tagline {
    font-size: 0.88rem;
    color: rgba(255,255,255,0.88);
    margin: 0.3rem 0 0.7rem;
    line-height: 1.5;
    font-weight: 300;
    word-break: keep-all;
    text-shadow: 0 1px 6px rgba(0,0,0,0.5);
  }
  .header-tagline em { font-style: normal; color: #ff6b6b; font-weight: 600; font-family: 'Noto Serif KR', serif; }
  .header-date {
    font-size: 0.78rem;
    color: rgba(255,255,255,0.82);
    line-height: 1.7;
    text-shadow: 0 1px 5px rgba(0,0,0,0.5);
    padding-left: 0.8rem;
    border-left: 2px solid rgba(226,198,130,0.75);
  }
  .header-date span { color: #ff6b6b !important; }

  .header-badges {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 0.75rem;
    margin-top: 1.1rem;
    flex-wrap: wrap;
  }
  /* 히어로 위의 배지: 밝은 유리 알약 */
  .connection-status {
    background: rgba(255,255,255,0.92);
    color: var(--ink-soft);
    padding: 0.42rem 0.85rem;
    border-radius: 999px;
    font-size: 0.72rem;
    font-weight: 600;
    display: inline-flex;
    align-items: center;
    gap: 0.4rem;
    transition: all 0.3s;
    white-space: nowrap;
    box-shadow: 0 4px 14px rgba(0,0,0,0.25);
  }
  .connection-status .dot { width: 7px; height: 7px; border-radius: 50%; background: #aaa; display: inline-block; }
  .connection-status.connecting .dot { background: #ffb36b; animation: pulse 1.5s infinite; }
  .connection-status.connected  .dot { background: var(--red); box-shadow: 0 0 6px rgba(255,90,90,0.7); }
  .connection-status.offline { background: var(--danger); color: white; }
  .connection-status.offline .dot { background: white; }

  .counter {
    background: var(--red-grad);
    color: #fff;
    font-weight: 700;
    font-size: 0.8rem;
    padding: 0.42rem 0.9rem;
    border-radius: 999px;
    display: inline-flex;
    align-items: center;
    gap: 0.35rem;
    box-shadow: 0 6px 18px rgba(255,77,77,0.45);
    white-space: nowrap;
  }
  .counter .num { font-family: 'Playfair Display', serif; font-size: 1.1rem; font-weight: 900; line-height: 1; }

  .scroll-hint { display: none; }

  /* ========== Compact Top Bar (히어로가 지나가면 등장) ========== */
  .topbar {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    z-index: 70;
    padding: calc(0.6rem + var(--safe-top)) 1.25rem 0.6rem;
    display: flex;
    align-items: center;
    gap: 0.75rem;
    background: var(--base);
    box-shadow: 0 8px 20px rgba(0,0,0,0.08);
    transform: translateY(-110%);
    transition: transform 0.35s var(--ease);
  }
  .topbar.visible { transform: translateY(0); }
  .topbar-title {
    font-family: 'Noto Serif KR', serif;
    font-weight: 700;
    font-size: 0.95rem;
    color: var(--starbucks-dark);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .topbar-title em { font-family: 'Noto Serif KR', serif; font-style: normal; color: var(--red); font-weight: 700; }
  .topbar-right { margin-left: auto; display: flex; align-items: center; gap: 0.6rem; }
  .topbar .dot { width: 9px; height: 9px; border-radius: 50%; background: #aaa; display: inline-block; box-shadow: var(--press-sm); }
  .topbar .dot.connecting { background: #f39c12; animation: pulse 1.5s infinite; }
  .topbar .dot.connected  { background: var(--red); }
  .topbar .dot.offline    { background: var(--danger); }
  .topbar .mini-count {
    font-family: 'Playfair Display', serif;
    font-weight: 900;
    font-size: 0.88rem;
    color: #fff;
    background: var(--red-grad);
    padding: 0.22rem 0.75rem;
    border-radius: 999px;
    line-height: 1.3;
    box-shadow: 4px 4px 10px rgba(255,77,77,0.3), -4px -4px 10px var(--sh-light);
  }

  /* ========== Content ========== */
  .sheet { position: relative; }
  .sheet::before { display: none; }

  /* ========== Name Input (함몰) ========== */
  .name-input-section { padding: 1.4rem 1.25rem 0.25rem; }
  .name-input-wrap { position: relative; }
  .name-input-wrap::before {
    content: '👤';
    position: absolute;
    left: 1.05rem;
    top: 50%;
    transform: translateY(-50%);
    font-size: 1rem;
    pointer-events: none;
  }
  .name-input {
    width: 100%;
    padding: 1rem 1rem 1rem 2.8rem;
    border: none;
    border-radius: 16px;
    font-size: 1rem;
    font-weight: 500;
    background: var(--base);
    box-shadow: var(--press);
    transition: box-shadow 0.25s;
  }
  .name-input:focus { outline: none; box-shadow: var(--press), 0 0 0 1px var(--red-line); }
  .name-input::placeholder { color: var(--ink-muted); font-weight: 400; }


  /* ========== Name Toggle Switches (주문자 선택) ========== */
  .name-section-title { display: flex; align-items: center; gap: 0.6rem; margin: 0 0 1rem; }
  .name-section-title .num { font-family: 'Montserrat', sans-serif; font-weight: 600; color: var(--red); font-size: 0.85rem; letter-spacing: 0.1em; }
  .name-section-title h2 { font-family: 'Noto Serif KR', serif; font-weight: 700; font-size: 1.2rem; color: var(--starbucks-dark); }
  .name-selected {
    margin-left: auto;
    font-size: 0.76rem;
    font-weight: 600;
    color: var(--ink-muted);
    background: var(--base);
    padding: 0.3rem 0.85rem;
    border-radius: 999px;
    box-shadow: var(--press-sm);
    white-space: nowrap;
    max-width: 50%;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .name-selected.active { color: #fff; background: var(--red-grad); box-shadow: 4px 4px 10px rgba(255,77,77,0.3), -4px -4px 10px var(--sh-light); }

  .name-toggle-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 0.8rem; }

  .name-toggle {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 0.5rem;
    width: 100%;
    min-height: 54px;
    padding: 0.55rem 0.7rem 0.55rem 0.95rem;
    border: none;
    border-radius: 16px;
    background: var(--base);
    box-shadow: var(--raise-sm);
    cursor: pointer;
    font-size: 0.95rem;
    font-weight: 500;
    color: var(--ink);
    text-align: left;
    transition: box-shadow 0.2s var(--ease), color 0.2s;
  }
  .name-toggle:active { box-shadow: var(--press-sm); }
  .name-toggle:focus-visible { outline: 2px solid var(--red-line); outline-offset: 2px; }
  .name-toggle-label { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .name-toggle[aria-checked="true"] { color: var(--red-deep); font-weight: 700; }
  .name-toggle.custom { grid-column: 1 / -1; }

  /* 스위치: 함몰된 트랙 + 돌출된 손잡이, 켜지면 레드 */
  .switch {
    position: relative;
    flex-shrink: 0;
    width: 46px;
    height: 26px;
    border-radius: 999px;
    background: var(--base);
    box-shadow: var(--press-sm);
    transition: background 0.25s var(--ease), box-shadow 0.25s var(--ease);
  }
  .switch .knob {
    position: absolute;
    top: 3px;
    left: 3px;
    width: 20px;
    height: 20px;
    border-radius: 50%;
    background: var(--base);
    box-shadow: 2px 2px 5px #c4c4c4, -2px -2px 5px #ffffff;
    transition: transform 0.25s var(--ease), background 0.25s;
  }
  .name-toggle[aria-checked="true"] .switch { background: var(--red-grad); box-shadow: inset 2px 2px 5px rgba(200,40,40,0.45), inset -2px -2px 5px rgba(255,160,160,0.6); }
  .name-toggle[aria-checked="true"] .switch .knob { transform: translateX(20px); background: #fff; box-shadow: 1px 1px 4px rgba(160,30,30,0.45); }

  .name-input-wrap[hidden] { display: none; }
  .name-input-wrap { margin-top: 0.9rem; }

  @media (prefers-reduced-motion: reduce) { .switch, .switch .knob { transition: none; } }
  @media (min-width: 640px)  { .name-toggle-grid { grid-template-columns: repeat(3, 1fr); gap: 1rem; } }
  @media (min-width: 1024px) { .name-toggle-grid { grid-template-columns: repeat(5, 1fr); } }

  .container { padding: 1.25rem; }

  .section-title { display: flex; align-items: center; gap: 0.6rem; margin: 0.9rem 0 1.1rem; }
  .section-title .num { font-family: 'Montserrat', sans-serif; font-weight: 600; color: var(--red); font-size: 0.85rem; letter-spacing: 0.1em; }
  .section-title h2 { font-family: 'Noto Serif KR', serif; font-weight: 700; font-size: 1.2rem; color: var(--starbucks-dark); }
  .section-title .count {
    margin-left: auto;
    font-size: 0.76rem;
    color: var(--red);
    background: var(--base);
    padding: 0.3rem 0.85rem;
    border-radius: 999px;
    box-shadow: var(--raise-xs);
    font-weight: 600;
    font-family: 'Montserrat', 'Noto Sans KR', sans-serif;
    letter-spacing: 0.08em;
  }
  .order-section-title { flex-wrap: wrap; row-gap: 0.6rem; }
  .order-section-title .count { margin-left: 0; }

  .order-date-chip {
    margin-left: auto;
    font-size: 0.72rem;
    color: var(--red);
    background: var(--base);
    padding: 0.3rem 0.8rem;
    border-radius: 999px;
    border: 1px solid var(--red-line);
    box-shadow: var(--raise-xs);
    font-weight: 600;
    white-space: nowrap;
  }
  .reset-btn {
    font-size: 0.72rem;
    color: var(--danger);
    background: var(--base);

  // ============ Date Helpers ============
  // 회의 스케줄: 매주 수요일 16:30 (커피는 회의 1시간 전 15:30에 발송)
  const MEETING_WEEKDAY = 3;      // 0=일, 1=월, 2=화, 3=수, 4=목, 5=금, 6=토 (Date.getDay 기준)
  const MEETING_HOUR = 16;
  const MEETING_MINUTE = 30;

  // "회의일 키"를 반환: 화요일 저녁부터 자정을 넘어 수요일 회의 시작 전까지 동일한 키 유지
  // → 자정 리셋으로 인한 데이터 유실 방지
  function getMeetingDayKey() {
    return formatDateKey(getMeetingDate(new Date()));
  }

  function getMeetingDate(now) {
    const weekday = now.getDay();
    if (weekday === MEETING_WEEKDAY) {
      // 오늘이 수요일: 회의 시각(16:30) 이전이면 오늘, 이후면 다음 주 수요일
      const meetingTime = new Date(now);
      meetingTime.setHours(MEETING_HOUR, MEETING_MINUTE, 0, 0);
      if (now < meetingTime) {
        return now;
      } else {
        const next = new Date(now);
        next.setDate(next.getDate() + 7);
        return next;
      }
    }
    // 다른 요일: 다음 수요일로
    let daysUntil = (MEETING_WEEKDAY - weekday + 7) % 7;
    if (daysUntil === 0) daysUntil = 7;
    const target = new Date(now);
    target.setDate(target.getDate() + daysUntil);
    return target;
  }

  function formatDateKey(d) {
    const y = d.getFullYear();
    const m = String(d.getMonth() + 1).padStart(2, '0');
    const day = String(d.getDate()).padStart(2, '0');
    return `${y}-${m}-${day}`;
  }

  // Backward compatibility alias
  function getTodayKey() {
    return getMeetingDayKey();
  }

  function getTodayDisplay() {
    const opts = { year: 'numeric', month: 'long', day: 'numeric', weekday: 'long' };
    return new Date().toLocaleDateString('ko-KR', opts);
  }

  // 회의일 표시용 (예: "2026년 4월 22일 수요일")
  function getMeetingDayDisplay() {
    const opts = { year: 'numeric', month: 'long', day: 'numeric', weekday: 'long' };
    return getMeetingDate(new Date()).toLocaleDateString('ko-KR', opts);
  }

  // ============ Connection Status ============
  function setConnectionStatus(state, msg) {

  // ============ Firebase Data Layer ============
  function subscribeToOrders() {
    if (!isFirebaseReady) {
      setConnectionStatus('offline', '⚠️ Firebase 미설정');
      showToast('⚠️ Firebase 설정이 필요합니다. FIREBASE_SETUP.md 확인', true);
      return;
    }

    const todayKey = getTodayKey();
    ordersRef = ref(db, `orders/${todayKey}`);

    setConnectionStatus('connecting', '연결 중...');

    onValue(ordersRef, (snapshot) => {
      const data = snapshot.val() || {};
      // Firebase returns object { id: {...}, id: {...} } -> convert to sorted array
      orderList = Object.entries(data).map(([id, order]) => ({
        id,
        ...order
      })).sort((a, b) => (a.timestamp || 0) - (b.timestamp || 0));

      setConnectionStatus('connected', '실시간 연결됨');
      renderOrderList();
    }, (error) => {
      console.error('Firebase read error:', error);
      setConnectionStatus('offline', '연결 오류');
      showToast('⚠️ 데이터베이스 연결 실패', true);
    });
  }

  async function addOrderToFirebase(order) {
    if (!isFirebaseReady) {
      showToast('⚠️ Firebase 미설정 - 저장 불가', true);
      return false;
    }
    try {
      const todayKey = getTodayKey();
      const listRef = ref(db, `orders/${todayKey}`);
      await push(listRef, order);
      return true;
    } catch (e) {
      console.error('Add order failed:', e);
      showToast('⚠️ 주문 저장 실패', true);
      return false;
    }
  }

  async function deleteOrderFromFirebase(orderId) {
    if (!isFirebaseReady) return false;
    try {
      const todayKey = getTodayKey();
      const itemRef = ref(db, `orders/${todayKey}/${orderId}`);
      await remove(itemRef);
      return true;
    } catch (e) {
      console.error('Delete order failed:', e);
      showToast('⚠️ 주문 삭제 실패', true);
      return false;
    }
  }

  // ============ Online/Offline Detection & Auto-Recovery ============
  window.addEventListener('online', () => {
    if (isFirebaseReady) {
      setConnectionStatus('connecting', '재연결 중...');
      // Detach and reattach listener to force fresh subscription
      if (ordersRef) {
        try { off(ordersRef); } catch(e) {}
      }
      subscribeToOrders();
    }
  });
  window.addEventListener('offline', () => {
    setConnectionStatus('offline', '오프라인');
  });

  // Recover when tab is refocused (mobile browsers often suspend background tabs)
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible' && isFirebaseReady && navigator.onLine) {
      // Verify current subscription is still active by re-checking the date key
      const nowKey = getTodayKey();
      if (nowKey !== currentDateKey) {
        currentDateKey = nowKey;
        setDateLabel();
        if (ordersRef) { try { off(ordersRef); } catch(e) {} }
        subscribeToOrders();
      }
    }
  });

    const input = document.getElementById('ordererName');

      btn.setAttribute('aria-checked', btn.dataset.name === value ? 'true' : 'false');

  function renderOrderList() {
    const list = document.getElementById('orderList');
    const hint = document.getElementById('orderHint');
    const counter = document.getElementById('orderCount');
    const sendBtn = document.getElementById('sendEmailBtn');
    const resetBtn = document.getElementById('resetBtn');

    counter.textContent = orderList.length;
    const tbCount = document.getElementById('topbarCount');
    if (tbCount) tbCount.textContent = orderList.length;

    if (orderList.length === 0) {
      list.innerHTML = `
        <div class="order-empty">
          <div class="order-empty-icon">☕</div>
          <p>메뉴를 선택해 주세요</p>
        </div>
      `;
      hint.textContent = '0잔';
      sendBtn.disabled = true;
      if (resetBtn) resetBtn.disabled = true;
      return;
    }

    hint.textContent = `${orderList.length}잔`;
    sendBtn.disabled = false;
    if (resetBtn) resetBtn.disabled = false;

    const html = orderList.map((order, idx) => {
      let timeStr = '';
      if (order.timestamp) {
        const t = new Date(order.timestamp);
        timeStr = `<span class="order-time">${String(t.getHours()).padStart(2,'0')}:${String(t.getMinutes()).padStart(2,'0')}</span>`;
      }
      return `
      <div class="order-item">
        <div class="order-num">${String(idx + 1).padStart(2, '0')}</div>
        <div class="order-details">
          <strong>${escapeHtml(order.menu)}</strong>
          <small>${escapeHtml(order.temp)} · ${escapeHtml(order.size)}${order.note ? ' · ' + escapeHtml(order.note) : ''}</small>
          <span class="order-person">👤 ${escapeHtml(order.person)}${timeStr}</span>
        </div>
        <button class="delete-btn" data-id="${order.id}" aria-label="삭제">×</button>
      </div>
    `;
    }).join('');

    list.innerHTML = html;

    document.querySelectorAll('.delete-btn').forEach(btn => {
      btn.addEventListener('click', () => deleteOrder(btn.dataset.id));
    });
  }

  function escapeHtml(s) {
    if (!s) return '';
    return String(s)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#039;');
  }

  // ============ Order Actions ============
  async function addOrder() {
    const person = document.getElementById('ordererName').value.trim();
    if (!person || !selectedMenu || !selectedTemp || !selectedSize) return;

    const note = document.getElementById('customNote').value.trim();

    const order = {
      person: person,
      menu: selectedMenu.name,
      temp: selectedTemp,
      size: selectedSize,
      note: note,
      timestamp: Date.now()

    const ok = await addOrderToFirebase(order);
    if (ok) {
      showToast(`✓ ${selectedMenu.name} 추가됨`);
      closeOptionsModal();
      // No need to manually update orderList - Firebase onValue will trigger re-render
    }

    await deleteOrderFromFirebase(orderId);

  }

  // ============ Email Generation ============
  function generateEmailContent() {
    const today = new Date();
    const meetingDate = getMeetingDate(today);
    const meetingDateStr = getMeetingDayDisplay();
    const subject = `[학부회의 커피 주문] ${meetingDate.getFullYear()}.${(meetingDate.getMonth()+1).toString().padStart(2,'0')}.${meetingDate.getDate().toString().padStart(2,'0')} (${meetingDate.toLocaleDateString('ko-KR', {weekday:'short'})}) 학부회의`;

    const counts = {};
    orderList.forEach(o => {
      const key = `${o.menu} · ${o.temp} · ${o.size}`;
      counts[key] = (counts[key] || 0) + 1;
    });

    let body = `안녕하세요 ${ASSISTANT_NAME}님,\n\n`;
    body += `전기공학부 학부회의 커피 주문 내역 전달 드립니다.\n\n`;
    body += `━━━━━━━━━━━━━━━━━━━━━━━━━━━━\n`;
    body += `📅 회의일: ${meetingDateStr}\n`;
    body += `⏰ 회의 시각: 오후 4시 30분\n`;
    body += `☕ 총 주문: ${orderList.length}잔 (${new Set(orderList.map(o => o.person)).size}명)\n`;
    body += `━━━━━━━━━━━━━━━━━━━━━━━━━━━━\n\n`;

    body += `【 주문자별 상세 내역 】\n(주문 시각 순)\n\n`;
    orderList.forEach((o, i) => {
      let timeStr = '';
      if (o.timestamp) {
        const t = new Date(o.timestamp);
        timeStr = ` [${String(t.getHours()).padStart(2,'0')}:${String(t.getMinutes()).padStart(2,'0')}]`;
      }
      body += `${String(i+1).padStart(2,'0')}. ${o.person}${timeStr}\n`;
      body += `    → ${o.menu} / ${o.temp} / ${o.size}\n`;
      if (o.note) body += `    → 요청사항: ${o.note}\n`;
      body += `\n`;
    });

    body += `━━━━━━━━━━━━━━━━━━━━━━━━━━━━\n`;
    body += `【 스타벅스 주문용 집계 】\n`;
    body += `(수량 많은 순 — 바리스타 전달용)\n\n`;
    // Sort by count desc, then by name
    Object.entries(counts)
      .sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0]))
      .forEach(([key, cnt]) => {
        body += `• ${key} × ${cnt}잔\n`;
      });
    body += `\n━━━━━━━━━━━━━━━━━━━━━━━━━━━━\n\n`;
    body += `항상 수고 많으십니다. 감사합니다.\n\n`;
    body += `SSU Electrical Eng.\n`;
    body += `학부회의 커피 주문 시스템`;

    return { subject, body };
  }

  function showPreview() {
    if (orderList.length === 0) {
      showToast('⚠️ 먼저 주문을 추가해 주세요', true);
      return;
    }
    const { subject, body } = generateEmailContent();
    document.getElementById('previewTo').textContent = `${ASSISTANT_NAME} <${ASSISTANT_EMAIL}>`;
    document.getElementById('previewSubject').textContent = subject;
    document.getElementById('previewBody').textContent = body;
    document.getElementById('previewModal').classList.add('active');
    document.body.style.overflow = 'hidden';
  }

  function sendEmail() {
    if (orderList.length === 0) return;
    const { subject, body } = generateEmailContent();
    const mailto = `mailto:${ASSISTANT_EMAIL}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;
    window.location.href = mailto;
  }

  // ============ Utilities ============
  function showToast(msg, isError = false) {
    const toast = document.getElementById('toast');
    toast.textContent = msg;
    toast.style.background = isError ? 'var(--danger)' : 'var(--starbucks-dark)';
    toast.classList.add('show');
    setTimeout(() => toast.classList.remove('show'), 2200);
  }

  // ============ Event Listeners ============
  function attachEventListeners() {
    document.getElementById('ordererName').addEventListener('blur', saveOrdererName);
    document.getElementById('ordererName').addEventListener('input', updateNameSelectedLabel);
    document.getElementById('nameToggleGrid').addEventListener('click', onNameToggleClick);

    document.getElementById('menuGrid').addEventListener('click', e => {
      const item = e.target.closest('.menu-item');
      if (!item) return;
      openOptionsModal(parseInt(item.dataset.rank));
    });

    document.getElementById('tempOptions').addEventListener('click', e => {
      if (e.target.classList.contains('option-btn')) {
        selectedTemp = e.target.dataset.value;
        updateOptionButtons();
      }
    });

    document.getElementById('sizeOptions').addEventListener('click', e => {
      if (e.target.classList.contains('option-btn')) {
        selectedSize = e.target.dataset.value;
        updateOptionButtons();
      }
    });

    document.getElementById('addOrderBtn').addEventListener('click', addOrder);
    document.getElementById('cancelBtn').addEventListener('click', closeOptionsModal);
    document.getElementById('optionsModal').addEventListener('click', e => {
      if (e.target.id === 'optionsModal') closeOptionsModal();
    });

    document.getElementById('previewBtn').addEventListener('click', showPreview);
    document.getElementById('previewClose').addEventListener('click', closePreview);
    document.getElementById('previewModal').addEventListener('click', e => {
      if (e.target.id === 'previewModal') closePreview();
    });

    document.getElementById('sendEmailBtn').addEventListener('click', sendEmail);
    document.getElementById('resetBtn').addEventListener('click', resetAllOrders);
  }

  // ============ Meeting Day Rollover ============
  // 회의일 키가 바뀌면 자동으로 새 창구로 전환 (수요일 16:30 회의 시작 직후)
  // 화요일 저녁~수요일 회의 전까지는 같은 키 유지 → 자정 리셋 문제 없음
  setInterval(() => {
    const newDateKey = getTodayKey();
    if (newDateKey !== currentDateKey) {
      currentDateKey = newDateKey;
      setDateLabel();
      if (ordersRef) { try { off(ordersRef); } catch(e) {} }
      subscribeToOrders();
      showToast('📅 다음 회의일 주문 창구로 전환되었습니다');
    }
  }, 60000); // 매 1분마다 체크

  // ============ Immersive: 히어로가 스크롤로 사라지면 컴팩트 톱바 표시 ============
  function setupTopbar() {
    try {
      const hero = document.getElementById('hero');
      const topbar = document.getElementById('topbar');
      if (!hero || !topbar) return;
      let ticking = false;
      const update = () => {
        ticking = false;
        // 히어로는 sticky라 항상 화면에 있으므로, 시트가 히어로를 덮은 정도(scrollY)로 판단
        const passed = window.scrollY > hero.offsetHeight - 120;
        topbar.classList.toggle('visible', passed);
        topbar.setAttribute('aria-hidden', passed ? 'false' : 'true');
      };
      window.addEventListener('scroll', () => {
        if (!ticking) { ticking = true; requestAnimationFrame(update); }
      }, { passive: true });
      window.addEventListener('resize', update, { passive: true });
      update();
    } catch (e) { console.warn('topbar setup skipped:', e); }
  }

  // ============ Init ============
  function init() {
    try {
      currentDateKey = getTodayKey();
      renderMenu();
      renderNameToggles();
      setDateLabel();
      attachEventListeners();
      setupTopbar();
      restoreOrdererName();
      subscribeToOrders();  // Start Firebase real-time listener
    } catch (e) {
      console.error('Init error:', e);
      // 초기화 실패해도 최소한 메뉴는 표시 시도
      try { renderMenu(); } catch(_) {}
      showToast('⚠️ 일부 기능 초기화에 실패했습니다', true);
    }
  }

  // DOM이 준비되지 않은 상태에서 실행되면 안전하게 대기
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }
</script>
